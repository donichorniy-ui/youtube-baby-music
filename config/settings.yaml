# Global pipeline behavior — one video at a time, 9:16, optimized for Shorts/Reels.
llm:
  provider: groq
  model: llama-3.3-70b-versatile   # заменено на надёжную модель
  temperature: 0.9

tts:
  provider: edge
  edge_voice: en-US-AriaNeural  # будет переопределено голосом канала
  edge_rate: "+8%"
  edge_pitch: "+2Hz"
  speed: 1.05

visuals:
  provider: pixabay       # заменено с pexels
  clips_per_video: 5
  ai_image_style: ""

video:
  width: 1080
  height: 1920
  fps: 30
  cut_every_seconds: 4.0
  target_seconds: 25
  color_grade: true
  encode_preset: slow
  crf: 19
  add_progress_bar: true
  progress_bar_color: "0x06D6A0"
  music_volume_db: -18
  safe_zone_padding: 180

captions:
  enabled: true
  model: base
  hook_title_seconds: 2.6
  style:
    fontname: Montserrat
    font_size: 80
    primary_color: "&H00FFFFFF"
    highlight_color: "&H0000F2FF"
    outline_color: "&H00000000"
    outline: 3
    shadow: 2
    position: middle
    max_words_per_cue: 3
    uppercase: true

metadata:
  title_variants: 5
  hashtags_per_post: 8

publish:
  provider: dry_run
  queue: true
  platforms: ["youtube"]
  stagger_seconds: 0

compliance:
  ai_disclosure: true
  disclaimers: {}
